      const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const lerp = (a, b, u) => a + (b - a) * u;
      const easeOut = p => 1 - (1 - p) * (1 - p);
      const easeIn = p => p * p;
      const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const bump = (t, a, m, b) => t < a || t > b ? 0 : t < m ? easeInOut((t - a) / (m - a)) : 1 - easeInOut((t - m) / (b - m));
      const quad = (p0, c, p1, u) => [
        (1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * c[0] + u * u * p1[0],
        (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * c[1] + u * u * p1[1]
      ];

      // --- 選手（シンプルな棒人間） ---
      function makePlayer(color) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('stroke', color);
        g.setAttribute('stroke-linecap', 'round');
        g.setAttribute('stroke-linejoin', 'round');
        g.setAttribute('fill', 'none');
        const part = (tag, attrs) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          g.appendChild(e);
          return e;
        };
        const p = {
          leg1: part('polyline', { 'stroke-width': 7 }),
          leg2: part('polyline', { 'stroke-width': 7 }),
          body: part('line', { 'stroke-width': 12 }),
          arm:  part('line', { 'stroke-width': 6 }),
          head: part('circle', { r: 10, fill: color, stroke: 'none' })
        };
        document.getElementById('opPlayers').appendChild(g);
        return p;
      }
      // dir: 1 = 右向き（自チーム）, -1 = 左向き（相手チーム）
      // lean: 上半身の傾き（正で右へ）
      function pose(p, x, lift, crouch, armAngle, dir = 1, lean = 0) {
        const foot = GROUND - lift;
        const hip = foot - 40 + crouch;
        const neckX = x + lean;
        const neck = hip - Math.sqrt(Math.max(38 * 38 - lean * lean, 100));
        const kneeY = (hip + foot) / 2;
        const kneeX = x + dir * (4 + crouch * 0.9);
        p.leg1.setAttribute('points', `${x},${hip} ${kneeX},${kneeY} ${x - 7 * dir},${foot}`);
        p.leg2.setAttribute('points', `${x},${hip} ${kneeX + 5 * dir},${kneeY} ${x + 8 * dir},${foot}`);
        p.body.setAttribute('x1', x); p.body.setAttribute('y1', hip);
        p.body.setAttribute('x2', neckX); p.body.setAttribute('y2', neck);
        const sy = neck + 4;
        p.arm.setAttribute('x1', neckX); p.arm.setAttribute('y1', sy);
        p.arm.setAttribute('x2', neckX + Math.cos(armAngle) * 30);
        p.arm.setAttribute('y2', sy + Math.sin(armAngle) * 30);
        p.head.setAttribute('cx', neckX + lean * 0.35); p.head.setAttribute('cy', neck - 14);
      }

      // 自チーム
      const receiver = makePlayer('rgba(255,255,255,.85)');
      const setter   = makePlayer('rgba(255,255,255,.85)');
      const spiker   = makePlayer('#E9A23B');
      // 相手チーム
      const OPP = 'rgba(255,255,255,.85)';
      const opp1 = makePlayer(OPP); // 前でダイブする選手
      const opp2 = makePlayer(OPP);
      const opp3 = makePlayer(OPP);

      // --- ボールの軌道 ---
      const HIT = [274, 68];
      const LAND = [322, 239];
      function ballAt(t) {
        if (t < 100)  return [340, 200];                                                 // 相手前衛の手元
        if (t < 480)  return quad([340, 200], [220, -500], [108, 184], (t - 100) / 380); // アンダーサーブ（高い山なり）
        if (t < 980)  return quad([108, 184], [150, -70], [228, 134], (t - 480) / 500);  // レシーブ
        if (t < 1380) return quad([228, 134], [245, -10], HIT, (t - 980) / 400);          // トス
        if (t < 1580) {                                                                   // スパイク
          const u = easeIn((t - 1380) / 200);
          return [lerp(HIT[0], LAND[0], u), lerp(HIT[1], LAND[1], u)];
        }
        return quad(LAND, [334, 205], [348, LAND[1]], prog(t, 1580, 1880));              // 跳ね返り
      }

      const trail = [];
      let start = 0;

      function frame(now) {
        // 最初のサーブ部分だけ少しゆっくり見せる（山なりの軌道のため）
        const T = now - start;
        const t = T < 700 ? T * 480 / 700 : T - 220;

        // --- 自チーム ---
        const rc = bump(t, 250, 480, 750);
        pose(receiver, 80, 0, 14 * rc, 0.5 - 0.3 * rc);

        const sc = bump(t, 820, 940, 1000);
        const sl = 6 * bump(t, 960, 1060, 1200);
        pose(setter, 225, sl, 8 * sc, -1.45);

        const sx = t < 1100 ? lerp(150, 240, easeOut(prog(t, 650, 1100))) : lerp(240, 250, prog(t, 1100, 1380));
        const crouch = 14 * bump(t, 1040, 1120, 1180);
        const lift = t < 1380 ? 75 * easeOut(prog(t, 1150, 1380)) : 75 * (1 - easeIn(prog(t, 1380, 1760)));
        let arm;
        if (t < 1200) arm = -2.6;
        else if (t < 1330) arm = lerp(-2.6, -2.4, prog(t, 1200, 1330));
        else arm = lerp(-2.4, 0.8, easeOut(prog(t, 1330, 1440)));
        pose(spiker, sx, lift, crouch, arm);

        // --- 相手チーム（構え → 反応 → 前の選手が飛びつく） ---
        const ready = 8 + 4 * Math.sin(t / 90);           // 構えて小刻みに揺れる
        const dive = easeOut(prog(t, 1420, 1620));
        // 前衛の選手：アンダーサーブ（腕を後ろから前へ振り上げる）→ 構え → 飛びつく
        let a1, c1;
        if (t < 500) {
          a1 = t < 100 ? lerp(0.9, 2.3, prog(t, 0, 100))
             : t < 260 ? lerp(2.3, 3.9, easeOut(prog(t, 100, 260)))
             : lerp(3.9, Math.PI - 0.5, easeInOut(prog(t, 260, 500)));
          c1 = lerp(12, ready, prog(t, 150, 500));
        } else {
          a1 = lerp(Math.PI - 0.5, 2.4, dive);
          c1 = lerp(ready, 22, dive);
        }
        pose(opp1, lerp(362, 344, dive), 0, c1, a1, -1, -18 * dive - 6 * bump(t, 40, 110, 300));
        const react = easeOut(prog(t, 1400, 1600));
        pose(opp2, lerp(414, 404, react), 0, lerp(ready, 14, react), Math.PI - 0.5, -1);
        pose(opp3, 460, 0, lerp(ready, 12, react), Math.PI - 0.5, -1);

        // --- ボールと残像 ---
        const [bx, by] = ballAt(t);
        ball.setAttribute('transform', `translate(${bx} ${by}) rotate(${t * 0.9})`);
        trail.unshift([bx, by]);
        if (trail.length > 7) trail.pop();
        const fast = t > 1380 && t < 1600;
        trailG.innerHTML = trail.slice(1).map(([x, y], i) =>
          `<circle cx="${x}" cy="${y}" r="${BALL_R - i}" fill="#fff" opacity="${(fast ? .5 : .16) * (1 - i / 7)}"/>`
        ).join('');

        // --- スパイクの瞬間の衝撃 ---
        const bp = prog(t, 1380, 1560);
        burst.setAttribute('cx', HIT[0]); burst.setAttribute('cy', HIT[1]);
        burst.setAttribute('r', 6 + 30 * easeOut(bp));
        burst.setAttribute('opacity', t >= 1380 ? 1 - bp : 0);

        // --- 着弾 ---
        const ip = prog(t, 1580, 1880);
        impact.setAttribute('rx', 50 * easeOut(ip));
        impact.setAttribute('ry', 12 * easeOut(ip));
        impact.setAttribute('opacity', t >= 1580 ? 1 - ip : 0);

        // --- 着弾点から画面を塗りつぶして切り替え ---
        if (t >= 1640 && !wipeStarted) {
          wipeStarted = true;
          const pt = svg.createSVGPoint();
          pt.x = LAND[0]; pt.y = GROUND;
          const sp = pt.matrixTransform(svg.getScreenCTM());
          const R = Math.hypot(Math.max(sp.x, innerWidth - sp.x), Math.max(sp.y, innerHeight - sp.y));
          const wipe = document.getElementById('opWipe');
          Object.assign(wipe.style, {
            width: `${R * 2}px`, height: `${R * 2}px`,
            left: `${sp.x - R}px`, top: `${sp.y - R}px`,
            transition: 'transform .4s cubic-bezier(.6,0,.4,1)'
          });
          requestAnimationFrame(() => wipe.style.transform = 'scale(1)');
        }

        if (t >= 2100) { finish(); return; }
        raf = requestAnimationFrame(frame);
      }
      function begin() {
        updateVh();
        start = performance.now();
        raf = requestAnimationFrame(frame);
      }
      begin();
    })();
  </script>
</body>
