  <!-- 文字フォントは後から読み込む（起動時の待ち時間を短くするため） -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --navy: #14213D;
      --court: #E9A23B;
      --team-a: #2F6FEB;
      --team-b: #E5484D;
      --paper: #F3F5F9;
      --ink: #14213D;
      --muted: #6B7690;
      --vh: 1vh;                /* 実際の画面の高さの1%（JSで更新） */
      --setup-slot: min(26vw, 140px);
      --slot: #17607F;          /* 1チーム目：青緑の〇に白い背番号 */
      --team2: #C0303A;         /* 2チーム目：白い〇に赤い背番号 */
      /* 体育館の床（ライトオーク調のフローリング） */
      --oak:
        repeating-linear-gradient(0deg, rgba(122, 82, 34, .13) 0 1px, transparent 1px 24px),
        repeating-linear-gradient(90deg, transparent 0 96px, rgba(122, 82, 34, .07) 96px 97px, transparent 97px 190px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .10) 0 12px, rgba(160, 110, 50, .05) 12px 24px),
        linear-gradient(180deg, #EDD3A6, #E3C38F);
      --ease: cubic-bezier(.2, .8, .2, 1);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { height: 100%; margin: 0; }
    /* 画面外（右側）に待機している画面のせいでページが縮小表示されないように、はみ出しを切る */
    html { overflow: hidden; }
    body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
    body {
      font-family: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--navy);
      color: var(--ink);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- 画面切り替え ---------- */
    .screen {
      position: absolute;
      top: 0; bottom: 0;
      left: env(safe-area-inset-left, 0px);    /* 横向き時のノッチ（切り欠き）を避ける */
      right: env(safe-area-inset-right, 0px);
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform .45s var(--ease), opacity .45s var(--ease);
    }
    .screen.is-hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
    .screen.is-hidden-left  { transform: translateX(-25%); opacity: 0; pointer-events: none; }

    /* ---------- メニュー画面 ---------- */
    #menu, #bye {
      background: var(--navy);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      padding-top: calc(32px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    }
    .title-block { text-align: center; opacity: 0; transform: translateY(12px); animation: rise .7s var(--ease) .1s forwards; }
    .title-block h1 { font-size: clamp(2rem, 9.5vw, 3rem); font-weight: 800; margin: 0; line-height: 1.2; white-space: nowrap; }
    .title-block .rule-badge {
      display: inline-block;
      margin: 10px 0 0;
      padding: 3px 16px;
      border: 2px solid #fff;
      border-radius: 999px;
      font-size: clamp(1rem, 4.4vw, 1.2rem);
      font-weight: 800;
      letter-spacing: .1em;
    }
    #menu { position: absolute; }
    .app-version {
      position: absolute;
      right: 16px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      margin: 0;
      font-size: .8rem;
      font-weight: 700;
      color: rgba(255,255,255,.45);
      letter-spacing: .05em;
    }
    .title-block .app-name { font-size: clamp(1.05rem, 4.6vw, 1.3rem); font-weight: 700; color: var(--court); margin: 10px 0 0; letter-spacing: .08em; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .menu-actions {
      width: 100%;
      max-width: 340px;
      display: grid;
      gap: 12px;
      margin-top: 48px;
      opacity: 0;
      transform: translateY(12px);
      animation: rise .7s var(--ease) .3s forwards;
    }
    .menu-btn {
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,.22);
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform .15s ease, background-color .2s ease, border-color .2s ease;
    }
    .menu-btn.quit { margin-top: 48px; }
    .menu-btn .sub { font-size: .78rem; font-weight: 500; color: rgba(255,255,255,.6); }
    .menu-btn.primary { background: var(--court); border-color: var(--court); color: var(--navy); }
    .menu-btn.primary .sub { color: rgba(20,33,61,.7); }
    .menu-btn:active { transform: scale(.97); }
    .menu-btn:hover { border-color: rgba(255,255,255,.5); }
    .menu-btn.primary:hover { background: #F2B150; border-color: #F2B150; }
    .menu-btn:focus-visible, .back-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* ---------- 終了画面 ---------- */
    #bye h2 { font-size: 1.6rem; font-weight: 800; margin: 0 0 8px; }
    #bye p { color: rgba(255,255,255,.65); margin: 0 0 36px; font-size: .9rem; text-align: center; }
    #bye .menu-btn { max-width: 340px; justify-content: center; }

    /* ---------- オーダー登録画面 ---------- */
    #setup { background: var(--paper); display: flex; flex-direction: column; }
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      background: var(--navy);
      color: #fff;
    }
    .app-bar h2 { font-size: 1.05rem; margin: 0; font-weight: 800; }
    .back-btn {
      font: inherit;
      font-weight: 700;
      background: rgba(255,255,255,.12);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .back-btn:active { transform: scale(.96); }

    .steps { display: flex; gap: 8px; justify-content: center; padding: 16px 16px 0; }
    .step {
      flex: 1;
      max-width: 200px;
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 10px 0;
      border-radius: 12px;
      background: #E3E7EF;
      color: var(--muted);
      transition: background-color .3s, color .3s;
    }
    .step.is-current { background: var(--navy); color: #fff; }
    .step.is-done::after { content: " ✓"; color: #2E9E5B; }

    .order-body { width: 100%; max-width: 600px; margin: 0 auto; padding: 16px 12px 8px; flex: 1; }
    .order-body.slide-next { animation: slideNext .4s var(--ease); }
    .order-body.slide-prev { animation: slidePrev .4s var(--ease); }
    @keyframes slideNext { from { opacity: 0; transform: translateX(40px); } }
    @keyframes slidePrev { from { opacity: 0; transform: translateX(-40px); } }

    .field-label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 6px; }
    .team-name {
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #C9D0DC;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    .team-name:focus { outline: none; border-color: var(--slot); }

    .court { margin-top: 26px; }
    .net-line { height: 5px; background: var(--navy); border-radius: 3px; }
    .court-box { margin: 0 4%; border: 2px solid var(--navy); border-top: 0; background: var(--oak); }
    .court-row { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; padding: 18px 4px; }
    .court-row.front { border-bottom: 2px solid var(--navy); }

    .slot {
      position: relative;
      width: var(--setup-slot);
      height: var(--setup-slot);
      border-radius: 50%;
      font: inherit;
      font-weight: 800;
      font-size: clamp(1.9rem, 9.5vw, 3rem);
      cursor: pointer;
      transition: transform .15s ease, background-color .2s;
      border: 2.5px dashed rgba(90, 60, 20, .45);
      background: rgba(255, 255, 255, .35);
      color: rgba(90, 60, 20, .55);
    }
    .slot.is-filled { background: #fff; border: 3px solid var(--slot); color: var(--slot); }
    .order-body.team-2 .slot.is-filled,
    .vs-slot.is-filled.t1 { background: #fff; border: 3px solid var(--team2); color: var(--team2); }
    .vs-name.t0, .m-name.t0 { color: var(--slot); }
    .vs-name.t1, .m-name.t1 { color: var(--team2); }
    .slot:active { transform: scale(.94); }
    .slot:focus-visible { outline: 3px solid var(--court); outline-offset: 3px; }
    .slot.pop { animation: slotPop .35s var(--ease); }
    @keyframes slotPop { 50% { transform: scale(1.12); } }
    .slot .order-badge { width: 34px; height: 34px; font-size: 1.05rem; top: -6px; left: -6px; }
    .order-badge {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--court);
      color: var(--navy);
      font-size: .9rem;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .order-summary { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1rem; }
    .order-summary .count { font-weight: 800; margin-right: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid #D5DAE3; border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 700; }
    .chip b { width: 24px; height: 24px; border-radius: 50%; background: var(--court); color: var(--navy); font-size: .75rem; display: grid; place-items: center; }
    .order-hint { color: var(--muted); font-size: .82rem; margin: 10px 0 0; }

    .order-footer {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(rgba(243,245,249,0), var(--paper) 35%);
    }
    .done-btn {
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 999px;
      border: 0;
      background: var(--court);
      color: var(--navy);
      box-shadow: 0 4px 14px rgba(233,162,59,.45);
      cursor: pointer;
      transition: transform .15s ease;
    }
    .done-btn:active { transform: scale(.96); }
    .done-btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

    /* ---------- 対戦確認画面 ---------- */
    #confirm { background: var(--paper); display: flex; flex-direction: column; }
    .bar-right { margin-left: auto; }
    .vs-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 10px; }
    .vs { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 620px; }
    .vs-side { position: relative; z-index: 1; }
    .vs-name {
      height: 46px;
      margin: 0 8px 36px;
      display: grid;
      place-items: center;
      padding: 0 6px;
      background: #fff;
      border: 2px solid var(--navy);
      border-radius: 8px;
      font-weight: 800;
      font-size: clamp(.85rem, 3.8vw, 1.1rem);
      text-align: center;
      line-height: 1.2;
      overflow: hidden;
    }
    .vs-court {
      --slot-size: min(16vw, 82px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--oak);
      border: 2px solid var(--navy);
    }
    /* 前衛・後衛の列。人数に関係なく等間隔に並ぶ（3人なら3等分、2人なら2等分） */
    .vs-col {
      height: calc(3 * (var(--slot-size) + 24px));
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }
    .vs-court .col-first { border-right: 2px solid var(--navy); }
    .vs-net {
      position: absolute;
      left: 50%;
      top: var(--net-top, 64px);
      bottom: var(--net-bottom, 56px);
      width: 5px;
      margin-left: -2.5px;
      background: var(--navy);
      border-radius: 3px;
      z-index: 2;
    }
    .vs-slot {
      position: relative;
      width: var(--slot-size);
      height: var(--slot-size);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(1.05rem, 5vw, 1.6rem);
      border: 2.5px dashed #C3CBD8;
      color: transparent;
    }
    .vs-slot.is-filled { background: #fff; border: 3px solid var(--slot); color: var(--slot); }
    .vs-slot .order-badge { width: 22px; height: 22px; font-size: .75rem; top: -5px; left: -5px; }
    .vs.pop .vs-slot.is-filled { animation: slotPop .4s var(--ease); }

    .order-tag {
      display: block;
      width: calc(100% - 16px);
      margin: 36px 8px 0;
      height: 48px;
      border-radius: 12px;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid var(--navy);
      transition: transform .15s ease;
    }
    .order-tag.first { background: var(--court); border-color: var(--court); color: var(--navy); }
    .order-tag.second { background: var(--navy); color: #fff; }
    .order-tag:active { transform: scale(.96); }
    .vs.flip .order-tag { animation: slotPop .35s var(--ease); }
    .order-hint2 { text-align: center; color: var(--muted); font-size: .8rem; font-weight: 700; margin: 10px 0 0; }
    .choice {
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .choice + .choice { border-left: 2px solid var(--navy); }
    .choice.first.on { background: var(--court); color: var(--navy); }
    .choice.second.on { background: var(--navy); color: #fff; }
    .choice:focus-visible { outline: 3px solid var(--court); outline-offset: -3px; }

    .vs-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      padding: 8px 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .swap-group { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .start-btn {
      grid-column: 3;
      justify-self: end;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 999px;
      border: 0;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
      margin-bottom: 22px;
      white-space: nowrap;
      transition: transform .15s ease;
    }
    .start-btn:active { transform: scale(.96); }

    /* ---------- 試合画面 ---------- */
    #match { background: var(--paper); display: flex; flex-direction: column; }
    .m-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 12px 10px 0; }
    .m-team {
      position: relative;
      background: #fff;
      border: 2px solid #D5DAE3;
      border-radius: 14px;
      padding: 6px 8px 6px;
      text-align: center;
      transition: border-color .3s, background-color .3s;
    }
    .m-team.serving { border-color: var(--court); background: #FFF6E8; }
    .m-name { min-width: 0; font-weight: 800; font-size: var(--big); height: calc(var(--big) * 1.15); line-height: calc(var(--big) * 1.15); white-space: nowrap; overflow: hidden; }
    .m-ball { position: absolute; top: -11px; right: -8px; width: 28px; height: 28px; z-index: 1; animation: hop .9s ease-in-out infinite; }
    .m-ball svg { width: 28px; height: 28px; display: block; }
    .m-board { --big: clamp(2.4rem, 12vw, 3.2rem); }
    .m-score { font-size: var(--big); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .m-score.bump { animation: bump .4s var(--ease); }
    @keyframes bump { 40% { transform: scale(1.25); color: var(--court); } }


    .m-courts { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 6px; }
    .m-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 620px; }
    .m-grid::after {
      content: "";
      position: absolute;
      left: 50%; top: -18px; bottom: -18px;
      width: 5px; margin-left: -2.5px;
      background: var(--navy);
      border-radius: 3px;
    }
    /* 試合中はコートと背番号を大きく */
    .m-courts .vs-court { --slot-size: min(20vw, 104px); }
    .m-courts .vs-col { height: calc(3 * (var(--slot-size) + 18px)); }
    .m-courts .vs-slot { font-size: clamp(1.5rem, 7.5vw, 2.4rem); }
    .m-courts .vs-slot .order-badge { width: 26px; height: 26px; font-size: .85rem; }
    .m-courts .vs-slot .serve-ball { width: 30px; height: 30px; top: -9px; right: -9px; }
    .m-courts .vs-slot .serve-ball svg { width: 30px; height: 30px; }
    .vs-slot.is-server { box-shadow: 0 0 0 4px var(--court); }
    .vs-slot .serve-ball {
      position: absolute; top: -8px; right: -8px;
      width: 26px; height: 26px;
      animation: hop .9s ease-in-out infinite;
    }
    .vs-slot.is-server.new { animation: slotPop .45s var(--ease); }
    @keyframes hop { 50% { transform: translateY(-5px); } }

    .m-controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
      padding: 10px 12px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }
    .point-btn {
      font: inherit;
      font-size: clamp(1.2rem, 5.5vw, 1.5rem);
      font-weight: 800;
      letter-spacing: .1em;
      height: 64px;
      border-radius: 18px;
      border: 0;
      background: var(--navy);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .12s ease;
      touch-action: manipulation;
    }

    .point-btn:active { transform: scale(.95); }
    .undo-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .undo-btn {
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid var(--navy); background: #fff; color: var(--navy);
      display: grid; place-items: center; cursor: pointer;
      touch-action: manipulation;
    }
    .undo-btn:disabled { opacity: .35; cursor: default; }
    /* ボタン欄の高さを固定して、状態が変わってもコートの位置がずれないようにする */
    .m-controls { box-sizing: content-box; height: 92px; }
    .m-controls.ready, .m-controls.over { grid-template-columns: 1fr; align-content: end; }
    .ctl-center { display: flex; justify-content: center; }
    .ctl-center.ready { flex-direction: column; gap: 6px; }
    .ctl-center.over { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
    .ctl-hint { margin: 0; text-align: center; font-size: .85rem; font-weight: 700; color: var(--muted); }
    .big-btn {
      font: inherit;
      font-size: clamp(1.2rem, 5.5vw, 1.5rem);
      font-weight: 800;
      letter-spacing: .06em;
      height: 64px;
      border-radius: 18px;
      border: 0;
      background: var(--court);
      color: var(--navy);
      box-shadow: 0 4px 14px rgba(233,162,59,.45);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease;
      animation: rise .4s var(--ease);
    }
    .big-btn:active { transform: scale(.97); }
    .big-btn.end { background: var(--team-b); color: #fff; box-shadow: 0 4px 14px rgba(229,72,77,.4); }
    .m-set.over { color: var(--team-b); }
    .m-courts .vs-slot { will-change: transform; }
    .undo-label { font-size: .8rem; font-weight: 700; color: var(--muted); }

    .vs-note { white-space: pre-line; margin: 14px 16px 0; padding: 10px 14px; border-radius: 10px; background: #FFF6E8; border: 1.5px solid var(--court); font-weight: 700; font-size: .9rem; text-align: center; }
    .m-set { display: flex; justify-content: center; align-items: baseline; gap: 12px; padding: 10px 10px 0; font-weight: 800; }
    .m-set span { font-size: .85rem; color: var(--muted); font-weight: 700; }
    .point-btn:disabled, .point-btn:disabled:active { opacity: .35; transform: none; cursor: default; }

    /* ---------- セット終了画面 ---------- */
    #setEnd { background: var(--navy); color: #fff; display: flex; flex-direction: column; }
    .se-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    .se-head { margin: 0; font-weight: 800; color: var(--court); font-size: 1.1rem; letter-spacing: .06em; }
    .se-winner { margin: 8px 0 18px; font-size: clamp(1.6rem, 7.5vw, 2.2rem); font-weight: 800; line-height: 1.3; }
    #setEnd:not(.is-hidden-right) .se-winner { animation: rise .6s var(--ease) .15s both; }
    .se-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; width: 100%; max-width: 360px; }
    .se-score .nm { font-weight: 700; font-size: .9rem; color: rgba(255,255,255,.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .se-score .pt { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .se-score .pt.win { color: var(--court); }
    .se-score .dash { font-size: 2rem; color: rgba(255,255,255,.5); }
    .se-sets { margin-top: 18px; width: 100%; max-width: 360px; border-top: 1px solid rgba(255,255,255,.15); }
    .se-row { display: grid; grid-template-columns: 5.5em 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.15); font-size: .9rem; }
    .se-row .lbl { color: rgba(255,255,255,.6); text-align: left; }
    .se-row .w { color: var(--court); font-weight: 800; }
    .se-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .se-next { margin-top: 28px; width: 100%; max-width: 340px; display: grid; gap: 12px; }
    .se-next p { margin: 0 0 4px; font-weight: 700; }
    .se-next .menu-btn { justify-content: center; }

    /* ---------- 確認ダイアログ ---------- */
    .dlg-backdrop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 35; background: rgba(20,33,61,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .dlg-backdrop.open { opacity: 1; pointer-events: auto; }
    .dlg {
      position: fixed; z-index: 36; left: 50%; top: 50%;
      width: min(88vw, 360px);
      transform: translate(-50%, -46%) scale(.96);
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .25s var(--ease);
      background: #fff; border-radius: 18px; padding: 22px 18px 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,.3);
    }
    .dlg.open { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
    .dlg-msg { margin: 0 0 20px; font-weight: 700; line-height: 1.6; text-align: center; white-space: pre-line; }
    .dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dlg-btn { font: inherit; font-weight: 800; font-size: 1rem; padding: 13px 0; border-radius: 12px; border: 2px solid #D5DAE3; background: #fff; color: var(--ink); cursor: pointer; }
    .dlg-btn.ok { background: var(--team-b); border-color: var(--team-b); color: #fff; }

    /* ---------- 選手交代の選択 ---------- */
    .sub-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid rgba(255,255,255,.3); border-radius: 12px; overflow: hidden; }
    .sub-toggle button { font: inherit; font-weight: 800; font-size: 1rem; padding: 12px 0; border: 0; background: transparent; color: rgba(255,255,255,.65); cursor: pointer; }
    .sub-toggle button + button { border-left: 2px solid rgba(255,255,255,.3); }
    .sub-toggle button.on { background: #fff; color: var(--navy); }

    /* ---------- ねぎらいの言葉 ---------- */
    .farewell {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
      background: var(--navy); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .farewell.show { opacity: 1; pointer-events: auto; }
    .fw-ball { width: 56px; height: 56px; margin-bottom: 18px; }
    .farewell.show .fw-ball { animation: fwBounce .9s cubic-bezier(.3,0,.5,1) infinite alternate; }
    @keyframes fwBounce { from { transform: translateY(-26px); } to { transform: translateY(0) scale(1.05, .95); } }
    .fw-text { font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 800; margin: 0; opacity: 0; }
    .fw-sub { margin: 10px 0 0; color: rgba(255,255,255,.65); font-size: .95rem; opacity: 0; }
    .farewell.show .fw-text { animation: rise .6s var(--ease) .15s forwards; }
    .farewell.show .fw-sub { animation: rise .6s var(--ease) .4s forwards; }
    .swap-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 0;
      background: var(--court);
      color: var(--navy);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(233,162,59,.45);
      transition: transform .15s ease;
    }
    .swap-btn:active { transform: scale(.94); }
    .swap-btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .swap-btn svg { transition: transform .55s var(--ease); }
    .swap-label { font-size: .85rem; font-weight: 700; color: var(--muted); }

    /* ---------- 背番号入力（テンキー） ---------- */
    .sheet-backdrop {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 25;
      background: rgba(20,33,61,.45);
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; z-index: 26;
      left: 50%; bottom: 0;
      width: 100%; max-width: 480px;
      transform: translate(-50%, 105%);
      transition: transform .35s var(--ease);
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
    .sheet-close { font: inherit; font-size: 1.3rem; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 8px; }
    .pad-display {
      margin: 10px 0 4px;
      height: 64px;
      border-radius: 12px;
      background: var(--paper);
      display: grid; place-items: center;
      font-size: 2.2rem; font-weight: 800;
    }
    .pad-display.empty { color: #A3AEC2; font-size: 1rem; font-weight: 700; }
    .pad-display.shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .pad-error { min-height: 1.3em; margin: 0 0 8px; color: var(--team-b); font-size: .85rem; font-weight: 700; text-align: center; }
    .pad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pad-key {
      font: inherit; font-size: 1.4rem; font-weight: 700;
      padding: 12px 0; border-radius: 12px;
      border: 0; background: #EEF1F6; color: var(--ink);
      cursor: pointer;
    }
    .pad-key.small { font-size: .95rem; }
    .pad-key:active { background: #DCE1EA; }
    .pad-ok {
      font: inherit; font-size: 1.1rem; font-weight: 800;
      width: 100%; margin-top: 10px; padding: 14px 0;
      border: 0; border-radius: 12px;
      background: var(--navy); color: #fff; cursor: pointer;
    }

    /* ---------- トースト ---------- */
    .toast {
      position: fixed;
      left: 50%;
      top: calc(72px + env(safe-area-inset-top, 0px));
      transform: translate(-50%, -16px);
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      font-size: .9rem;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s var(--ease);
      z-index: 30;
      width: max-content;
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* ---------- オープニング ---------- */
    #opening {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 20;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .45s ease;
      cursor: pointer;
      overflow: hidden;
    }
    #opening svg { width: min(94vw, 620px); height: auto; overflow: visible; }
    .op-floor { stroke: rgba(255,255,255,.35); stroke-width: 2; }
    .op-net-pole { stroke: rgba(255,255,255,.6); stroke-width: 3; }
    .op-net { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.6); stroke-width: 1.5; }
    .op-skip {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 0; right: 0;
      text-align: center;
      font-size: .78rem;
      color: rgba(255,255,255,.45);
    }
    .op-wipe {
      position: fixed;
      border-radius: 50%;
      background: var(--court);
      transform: scale(0);
      pointer-events: none;
    }
    /* オープニングが終わるまでメニューのアニメーションは待機 */
    body:not(.ready) #menu,
    body:not(.ready) #menu * { animation-play-state: paused; }

    /* ---------- 縦向きのときの案内 ---------- */
    .rotate-overlay {
      display: none;
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      z-index: 100;
      background: var(--navy); color: #fff;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .rot-phone {
      width: 56px; height: 96px;
      border: 4px solid #fff; border-radius: 12px;
      position: relative; margin-bottom: 28px;
      animation: rotPhone 2s var(--ease) infinite;
    }
    .rot-phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 4px; margin-left: -7px; border-radius: 2px; background: #fff; }
    @keyframes rotPhone { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    .rot-text { font-size: 1.4rem; font-weight: 800; margin: 0 0 10px; }
    .rot-sub { font-size: .9rem; color: rgba(255,255,255,.7); margin: 0; line-height: 1.7; }
    .rot-btn { margin-top: 24px; font: inherit; font-weight: 800; font-size: 1rem; padding: 14px 22px; border-radius: 999px; border: 0; background: var(--court); color: var(--navy); cursor: pointer; }
    /* 試合画面をスマホの縦向きで表示しているときだけ表示（登録などは縦向きのまま使える） */
    @media (orientation: portrait) and (max-width: 820px) {
      body.need-landscape .rotate-overlay { display: flex; }
    }

    /* ========== 横向き（スマホ）用レイアウト ========== */
    @media (orientation: landscape) and (max-height: 600px) {
      /* 共通：上部バーを細く */
      .app-bar { padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
      .app-bar h2 { font-size: .95rem; }
      .back-btn { padding: 6px 10px; font-size: .9rem; }

      /* オープニング：山なりのボールまで画面に収める */
      #opening svg { width: min(94vw, calc(var(--vh) * 120)); margin-top: calc(var(--vh) * 22); }
      .op-skip { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }

      /* メニュー */
      #menu { padding-top: 12px; padding-bottom: 12px; }
      .title-block h1 { font-size: calc(var(--vh) * 11); }
      .title-block .app-name { margin-top: 4px; }
      .title-block .rule-badge { margin-top: 6px; padding: 1px 14px; }
      .menu-actions { margin-top: calc(var(--vh) * 6); }
      .menu-btn { padding: 12px 20px; }
      .menu-btn.quit { margin-top: calc(var(--vh) * 8); }

      /* オーダー登録：左にコート、右にチーム名など */
      .steps { padding: 8px 16px 0; }
      .step { padding: 6px 0; font-size: .95rem; }
      #setup { --setup-slot: calc((var(--vh) * 100 - 150px) / 2); }
      .order-body {
        max-width: none;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-auto-rows: min-content;
        column-gap: 22px;
        padding: 10px 16px 70px;
      }
      .court { grid-column: 1; grid-row: 1 / span 5; margin-top: 0; }
      .order-body > :not(.court) { grid-column: 2; }
      .court-box { margin: 0 6px; }
      .court-row { grid-template-columns: repeat(3, calc(var(--setup-slot) + 12px)); padding: 8px 4px; }
      .slot { font-size: calc(var(--setup-slot) * .42); }
      .order-summary { margin-top: 14px; }
      .order-hint { display: none; }
      .done-btn { padding: 12px 24px; font-size: 1rem; }
      .order-footer { position: absolute; right: 0; bottom: 0; background: none; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

      /* 背番号テンキー：横長に並べて画面に収める */
      .sheet { max-width: 760px; padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .pad-display { height: 42px; margin: 6px 0 2px; font-size: 1.6rem; }
      .pad-error { margin: 0 0 4px; min-height: 1.2em; font-size: .8rem; }
      .pad-main { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 8px; }
      .pad-grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
      .pad-key { padding: 9px 0; font-size: 1.25rem; }
      .pad-key.small { font-size: .85rem; }
      .pad-ok { margin-top: 0; height: 100%; }

      /* 確認画面：中央にコート、左に案内とコートチェンジ、右に「配置を確認」 */
      #confirm {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        grid-template-rows: auto auto auto minmax(0, 1fr);
        grid-template-areas: "bar bar bar" "note vs ." "hint vs ." "swap vs start";
        column-gap: 12px;
      }
      #confirm .app-bar { grid-area: bar; }
      .vs-note { grid-area: note; margin: 10px 0 0 12px; font-size: .78rem; padding: 8px 10px; }
      .order-hint2 { grid-area: hint; margin: 10px 0 0 12px; text-align: left; }
      .vs-wrap { grid-area: vs; padding: 8px 0; }
      .vs-footer { display: contents; }
      .swap-group { grid-area: swap; align-self: end; margin: 0 0 12px 12px; }
      .swap-btn { width: 64px; height: 64px; }
      .start-btn { grid-area: start; align-self: end; justify-self: end; margin: 0 12px 14px 0; }
      .vs {
        width: auto; max-width: none;
        grid-template-columns: auto auto;
        --net-top: 36px; --net-bottom: 38px;
      }
      .vs .vs-court { --slot-size: calc((var(--vh) * 100 - 150px) / 3 - 12px); }
      .vs-col, .m-courts .vs-col { width: calc(var(--slot-size) + 20px); height: calc(3 * (var(--slot-size) + 12px)); }
      .vs-name { height: 30px; margin: 0 6px 12px; font-size: .85rem; }
      .order-tag { height: 36px; margin: 12px 6px 0; width: calc(100% - 12px); font-size: 1rem; }
      .vs-slot { font-size: calc(var(--slot-size) * .38); }

      /* 試合画面：左右にチーム（得点と得点ボタン）、中央にコート */
      #match {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas: "bar bar bar" "tl set tr" "tl court tr" "pl ctl pr";
        column-gap: 10px;
      }
      #match .app-bar { grid-area: bar; }
      .m-board, .m-controls { display: contents; }
      .m-board { --big: min(calc(var(--vh) * 15), 4rem); }
      #mTeamL { grid-area: tl; margin: 8px 0 8px 10px; }
      #mTeamR { grid-area: tr; margin: 8px 10px 8px 0; }
      .m-team { display: flex; flex-direction: column; justify-content: center; }
      .m-score { font-size: calc(var(--big) * 1.5); }
      .m-set { grid-area: set; padding: 6px 0 0; }
      .m-courts { grid-area: court; padding: 12px 0; }
      .m-grid { width: auto; grid-template-columns: auto auto; }
      .m-grid::after { top: -10px; bottom: -10px; }
      .m-courts .vs-court { --slot-size: calc((var(--vh) * 100 - 160px) / 3 - 12px); }
      .m-courts .vs-slot { font-size: calc(var(--slot-size) * .4); }
      .point-btn { height: 56px; margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .point-btn[data-side="L"] { grid-area: pl; margin-left: 10px; }
      .point-btn[data-side="R"] { grid-area: pr; margin-right: 10px; }
      .ctl-center { grid-area: ctl; margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); align-self: end; }
      .ctl-center .undo-btn { width: 50px; height: 50px; }
      .ctl-center .undo-label { display: none; }
      .ctl-center .big-btn { height: 56px; }
      .ctl-hint { display: none; }

      /* セット終了画面：左に結果、右に次へ */
      .se-body { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; align-content: center; justify-items: center; padding: 12px 24px; }
      .se-head, .se-winner, .se-score, .se-sets { grid-column: 1; }
      .se-next { grid-column: 2; grid-row: 1 / span 4; align-self: center; margin-top: 0; }
      .se-winner { margin: 4px 0 8px; font-size: 1.5rem; }
      .se-score .pt { font-size: 2.4rem; }
      .se-sets { margin-top: 10px; }
      .se-row { padding: 5px 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- ===== 縦向きのときの案内（横向き専用） ===== -->
  <div class="rotate-overlay" id="rotateOverlay" role="alert">
    <div class="rot-phone" aria-hidden="true"></div>
    <p class="rot-text">スマホを横向きにしてください</p>
    <p class="rot-sub">試合中は横向きで表示します。<br>向きが変わらないときは、スマホの「画面の向きのロック」をオフにしてください。</p>
    <button class="rot-btn" id="rotBtn" hidden>横向きの全画面で表示する</button>
  </div>

  <!-- ===== オープニング（レシーブ → トス → スパイク） ===== -->
  <div id="opening" aria-hidden="true">
    <svg id="opSvg" viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg">
      <line class="op-floor" x1="-40" y1="250" x2="520" y2="250"/>
      <line class="op-net-pole" x1="282" y1="250" x2="282" y2="124"/>
      <rect class="op-net" x="279" y="126" width="7" height="46"/>
      <g id="opPlayers"></g>
      <g id="opTrail"></g>
      <circle id="opBurst" r="0" fill="none" stroke="#fff" stroke-width="3" opacity="0"/>
      <ellipse id="opImpact" rx="0" ry="0" cx="322" cy="250" fill="none" stroke="#E9A23B" stroke-width="3" opacity="0"/>
      <g id="opBall"></g>
    </svg>
    <div class="op-skip">タップでスキップ</div>
    <div class="op-wipe" id="opWipe"></div>
  </div>

  <!-- ===== メニュー画面 ===== -->
  <section id="menu" class="screen" aria-label="メニュー">
    <div class="title-block">
      <h1>ビーチボールバレー</h1>
      <p class="rule-badge">6人制</p>
      <p class="app-name">副審判補助アプリ</p>
    </div>
    <p class="app-version" id="appVersion"></p>

    <nav class="menu-actions">
      <button class="menu-btn primary" data-action="setup">
        オーダー登録 <span class="sub">チーム名・背番号</span>
      </button>
      <button class="menu-btn quit" data-action="quit">
        終了
      </button>
    </nav>
  </section>

  <!-- ===== オーダー登録画面 ===== -->
  <section id="setup" class="screen is-hidden-right" aria-label="オーダー登録">
    <header class="app-bar">
      <button class="back-btn" data-action="back" id="backBtn">‹ メニュー</button>
      <h2 id="setupTitle">オーダー登録</h2>
    </header>

    <div class="steps">
      <div class="step" id="step0">1チーム目</div>
      <div class="step" id="step1">2チーム目</div>
    </div>

    <div class="order-body" id="orderBody">
      <label class="field-label" for="teamName">チーム名</label>
      <input class="team-name" id="teamName" type="text" placeholder="チーム名を入力" autocomplete="off">

      <div class="court">
        <div class="net-line" aria-hidden="true"></div>
        <div class="court-box">
          <div class="court-row front">
            <button class="slot" data-slot="FL"></button>
            <button class="slot" data-slot="FC"></button>
            <button class="slot" data-slot="FR"></button>
          </div>
          <div class="court-row back">
            <button class="slot" data-slot="BL"></button>
            <button class="slot" data-slot="BC"></button>
            <button class="slot" data-slot="BR"></button>
          </div>
        </div>
      </div>

      <div class="order-summary" id="orderSummary"></div>
      <p class="order-hint">〇をタップして背番号を入力します。空欄があると順番は繰り上がります。前衛が2人のときは左側が1になります。</p>
    </div>

    <div class="order-footer">
      <button class="done-btn" data-action="complete" id="doneBtn">次のチームを登録する</button>
    </div>
  </section>

  <!-- ===== 対戦確認画面 ===== -->
  <section id="confirm" class="screen is-hidden-right" aria-label="対戦確認">
    <header class="app-bar">
      <button class="back-btn" data-action="back" id="confirmBack">‹ 修正する</button>
      <h2 id="confirmTitle">対戦確認</h2>
      <button class="back-btn bar-right" data-action="menu">メニュー</button>
    </header>

    <p class="vs-note" id="vsNote" hidden></p>
    <div class="vs-wrap">
      <div class="vs" id="vs">
        <div class="vs-side" id="sideL"></div>
        <div class="vs-side" id="sideR"></div>
        <div class="vs-net" aria-hidden="true"></div>
      </div>
    </div>

    <p class="order-hint2">先攻・後攻はタップで入れ替えできます</p>
    <div class="vs-footer">
      <div class="swap-group">
      <button class="swap-btn" data-action="swap" aria-label="コートチェンジ（左右のチームを入れ替え）">
        <svg id="swapIcon" viewBox="0 0 48 24" width="48" height="24" aria-hidden="true">
          <path d="M4 12 H44 M4 12 L12 4 M4 12 L12 20 M44 12 L36 4 M44 12 L36 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="swap-label">コートチェンジ</span>
      </div>
      <button class="start-btn" data-action="start">配置を確認</button>
    </div>
  </section>

  <!-- ===== 試合画面 ===== -->
  <section id="match" class="screen is-hidden-right" aria-label="試合">
    <header class="app-bar">
      <button class="back-btn" data-action="back" id="matchBack">‹ 確認画面</button>
      <h2>試合中</h2>
    </header>

    <div class="m-set" id="mSet"></div>
    <div class="m-board">
      <div class="m-team" id="mTeamL"></div>
      <div class="m-team" id="mTeamR"></div>
    </div>

    <div class="m-courts">
      <div class="m-grid">
        <div id="mCourtL"></div>
        <div id="mCourtR"></div>
      </div>
    </div>

    <div class="m-controls" id="mControls"></div>
  </section>

  <!-- ===== セット終了・試合終了 ===== -->
  <section id="setEnd" class="screen is-hidden-right" aria-label="セット終了">
    <header class="app-bar">
      <button class="back-btn" data-action="back">‹ コートに戻る</button>
    </header>
    <div class="se-body">
      <p class="se-head" id="seHead"></p>
      <p class="se-winner" id="seWinner"></p>
      <div class="se-score" id="seScore"></div>
      <div class="se-sets" id="seSets"></div>
      <div class="se-next" id="seNext"></div>
    </div>
  </section>

  <!-- ===== 終了画面 ===== -->
  <section id="bye" class="screen is-hidden-right" aria-label="終了">
    <h2>終了しました</h2>
    <p>このまま画面を閉じてください。</p>
    <button class="menu-btn" data-action="back">メニューに戻る</button>
  </section>

  <!-- ===== ねぎらいの言葉 ===== -->
  <div class="farewell" id="farewell" aria-live="polite">
    <div class="fw-ball" id="fwBall"></div>
    <p class="fw-text">お疲れ様でした</p>
    <p class="fw-sub">ご利用ありがとうございました</p>
  </div>

  <!-- ===== 確認ダイアログ ===== -->
  <div class="dlg-backdrop" id="dlgBackdrop"></div>
  <div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgMsg">
    <p class="dlg-msg" id="dlgMsg"></p>
    <div class="dlg-actions">
      <button class="dlg-btn" id="dlgCancel">キャンセル</button>
      <button class="dlg-btn ok" id="dlgOk">OK</button>
    </div>
  </div>

  <!-- ===== 背番号テンキー ===== -->
  <div class="sheet-backdrop" id="padBackdrop"></div>
  <div class="sheet" id="pad" role="dialog" aria-label="背番号の入力">
    <div class="sheet-head">
      <span id="padPos">前衛・中央</span>
      <button class="sheet-close" id="padClose" aria-label="閉じる">×</button>
    </div>
    <div class="pad-display" id="padDisplay"></div>
    <p class="pad-error" id="padError"></p>
    <div class="pad-main">
    <div class="pad-grid">
      <button class="pad-key" data-key="1">1</button>
      <button class="pad-key" data-key="2">2</button>
      <button class="pad-key" data-key="3">3</button>
      <button class="pad-key" data-key="4">4</button>
      <button class="pad-key" data-key="5">5</button>
      <button class="pad-key" data-key="6">6</button>
      <button class="pad-key" data-key="7">7</button>
      <button class="pad-key" data-key="8">8</button>
      <button class="pad-key" data-key="9">9</button>
      <button class="pad-key small" data-key="clear">空欄</button>
      <button class="pad-key" data-key="0">0</button>
      <button class="pad-key small" data-key="del">⌫ 削除</button>
    </div>
    <button class="pad-ok" id="padOk">決定</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- バージョン（修正したらここを更新） ---------- */
    const APP_VERSION = '0.0';
    document.getElementById('appVersion').textContent = 'ver' + APP_VERSION;

    /* ---------- 画面の高さ（スマホのアドレスバー分を除いた実際の高さ） ---------- */
    function updateVh() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    updateVh();
    window.addEventListener('resize', updateVh);
    window.addEventListener('orientationchange', () => setTimeout(updateVh, 300));

    /* ---------- 画面の向き ----------
       試合開始まで（メニュー・オーダー登録・確認）：縦向き
       試合中（試合画面）：横向き
       Android（Chrome など）：試合画面に入ると全画面にして横向きに固定、戻ると縦向きに
       iPhone：Webページからは向きを固定できないため、試合画面を縦向きで見ているときは案内を表示 */
    const LANDSCAPE_SCREENS = ['match'];
    const KEEP_SCREENS = ['setEnd'];          // セット間の休憩中は向きを変えない
    const canLock = !!(document.documentElement.requestFullscreen && screen.orientation && screen.orientation.lock);
    // ホーム画面のアイコンから起動した（アプリとして全画面で動いている）か
    // → このときはブラウザの全画面機能を使わない（「全画面表示を終了するには…」の注記が出ないように）
    const inAppMode = ['fullscreen', 'standalone'].some(m => window.matchMedia(`(display-mode: ${m})`).matches)
      || window.navigator.standalone === true;
    function lockLandscape() {
      if (!canLock) return;
      const lock = () => screen.orientation.lock('landscape').catch(() => {});
      if (inAppMode || document.fullscreenElement) lock();
      else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(lock).catch(() => {});
    }
    function orientFor(id) {
      const land = LANDSCAPE_SCREENS.includes(id);
      document.body.classList.toggle('need-landscape', land);   // 案内は試合画面のときだけ
      if (!canLock) return;
      if (land) lockLandscape();
      else if (!KEEP_SCREENS.includes(id) && (inAppMode || document.fullscreenElement)) {
        screen.orientation.lock('portrait').catch(() => {});
      }
    }
    function releaseOrientation() {
      document.body.classList.remove('need-landscape');
      if (!canLock) return;
      if (inAppMode) { try { screen.orientation.unlock(); } catch (e) {} return; }
      if (!document.fullscreenElement) return;
      try { screen.orientation.unlock(); } catch (e) {}
      document.exitFullscreen().catch(() => {});
    }
    if (canLock) {
      document.getElementById('rotBtn').hidden = false;
      document.getElementById('rotBtn').addEventListener('click', lockLandscape);
    }

    /* ---------- 横向きのときは全画面に（URLバーを隠す） ----------
       画面が消えたり別のアプリに切り替えたりすると全画面が解除されるため、
       横向きで全画面になっていないときは、次に画面をタップした時点で全画面に戻す
       （ブラウザの決まりで、全画面にはタップなどの操作がきっかけとして必要） */
    const canFS = !!document.documentElement.requestFullscreen;
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    const landMQ = window.matchMedia('(orientation: landscape)');
    function needsFullscreen() {
      return canFS && isTouch && !inAppMode && landMQ.matches && !document.fullscreenElement && current !== 'bye';
    }
    function ensureFullscreen() {
      if (!needsFullscreen()) return;
      document.documentElement.requestFullscreen({ navigationUI: 'hide' })
        .then(() => { if (current === 'match' && canLock) screen.orientation.lock('landscape').catch(() => {}); })
        .catch(() => {});
    }
    document.addEventListener('click', ensureFullscreen, true);
    function hintFullscreen() {
      if (needsFullscreen()) toast('画面をタップすると全画面表示になります');
    }
    const onLandChange = () => setTimeout(hintFullscreen, 400);
    landMQ.addEventListener ? landMQ.addEventListener('change', onLandChange) : landMQ.addListener(onLandChange);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(hintFullscreen, 400); });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) setTimeout(hintFullscreen, 400); });

    /* ---------- 保存データ ---------- */
    // 端末には何も保存しない（毎回まっさらな状態から登録）
    // 以前のバージョンで保存されたデータも消しておく
    try { ['bbv-order-v2', 'vb-rotation-members', 'bbv-team-history'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    function blankMatch() {
      return {
        teams: [{ name: '', slots: {} }, { name: '', slots: {} }],
        left: 0,        // 左側に表示するチーム（0 = 1チーム目）
        first: 0,       // 先攻のチーム（初期値は1チーム目）
        setNo: 1,       // 今のセット
        sets: [],       // 終わったセットの結果 { score:[a,b], winner }
        setsWon: [0, 0],
        firstBySet: [], // 各セットの先攻
        lastServed: null // 前のセットで各チームが最後にサーブした選手の順番 [チーム0, チーム1]
      };
    }
    function saveData() {}
    let data = blankMatch();

    /* ---------- オーダーのルール ---------- */
    // 順番：前衛中央→前衛左→後衛左→後衛中央→後衛右→前衛右
    const ORDER = ['FC', 'FL', 'BL', 'BC', 'BR', 'FR'];
    const POS_NAME = { FL: '前衛・左', FC: '前衛・中央', FR: '前衛・右', BL: '後衛・左', BC: '後衛・中央', BR: '後衛・右' };

    // 順番の振り方
    //  ・通常は前衛の真ん中が 1
    //  ・前衛が2人のときは、その2人のうち左側が 1
    //  ・そこから ORDER の順にぐるっと回り、空欄は飛ばして繰り上げ
    function orderMap(team) {
      const s = team.slots;
      const front = ['FL', 'FC', 'FR'].filter(k => s[k]);
      let start = 'FC';
      if (front.length === 2) start = front[0];
      else if (!s.FC) start = ORDER.find(k => s[k]) || 'FC';
      const i0 = ORDER.indexOf(start);
      const map = {};
      let n = 0;
      for (let i = 0; i < ORDER.length; i++) {
        const k = ORDER[(i0 + i) % ORDER.length];
        if (s[k]) map[k] = ++n;
      }
      return map;
    }
    const orderedSlots = team => {
      const map = orderMap(team);
      return Object.keys(map).sort((a, b) => map[a] - map[b]);
    };

    /* ---------- 画面の描画 ---------- */
    let teamIndex = 0;
    const $ = id => document.getElementById(id);
    const team = () => data.teams[teamIndex];

    function renderSetup(anim) {
      const t = team();
      $('step0').className = 'step' + (teamIndex === 0 ? ' is-current' : ' is-done');
      $('step1').className = 'step' + (teamIndex === 1 ? ' is-current' : '');
      $('orderBody').classList.toggle('team-2', teamIndex === 1);   // 2チーム目は色を変える
      $('backBtn').textContent = teamIndex === 1 ? '‹ 1チーム目' : editMode ? '‹ 変更をやめる' : '‹ メニュー';
      $('setupTitle').textContent = editMode ? `オーダー変更（第${editFrom === 'setEnd' ? data.setNo + 1 : data.setNo}セット）` : 'オーダー登録';
      $('teamName').value = t.name;
      $('doneBtn').textContent = teamIndex === 0
        ? (editMode ? '次のチームへ' : '次のチームを登録する')
        : (editMode ? '変更完了' : '登録完了');
      renderSlots();
      if (anim) {
        const body = $('orderBody');
        body.classList.remove('slide-next', 'slide-prev');
        void body.offsetWidth;
        body.classList.add(anim);
      }
    }

    function renderSlots(popSlot) {
      const t = team();
      const map = orderMap(t);
      document.querySelectorAll('.slot').forEach(btn => {
        const k = btn.dataset.slot;
        const num = t.slots[k];
        btn.classList.toggle('is-filled', !!num);
        btn.innerHTML = num ? `<span class="order-badge">${map[k]}</span>${num}` : '＋';
        btn.setAttribute('aria-label', `${POS_NAME[k]}：${num ? '背番号' + num + '、' + map[k] + '番目' : '未入力'}`);
        if (k === popSlot) {
          btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
        }
      });
      const list = orderedSlots(t);
      $('orderSummary').innerHTML =
        `<span class="count">登録 ${list.length}人</span>` +
        list.map((k, i) => `<span class="chip"><b>${i + 1}</b>${t.slots[k]}</span>`).join('');
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    $('teamName').addEventListener('input', e => { team().name = e.target.value; saveData(); });

    /* ---------- 背番号テンキー ---------- */
    let editingSlot = null;
    let padValue = '';
    function openPad(slot) {
      editingSlot = slot;
      padValue = team().slots[slot] || '';
      $('padPos').textContent = POS_NAME[slot];
      $('padError').textContent = '';
      updatePad();
      document.activeElement && document.activeElement.blur();
      $('padBackdrop').classList.add('open');
      $('pad').classList.add('open');
    }
    function closePad() {
      editingSlot = null;
      $('padBackdrop').classList.remove('open');
      $('pad').classList.remove('open');
    }
    function updatePad() {
      const d = $('padDisplay');
      d.textContent = padValue || '空欄（選手なし）';
      d.classList.toggle('empty', !padValue);
    }
    function padError(msg) {
      $('padError').textContent = msg;
      const d = $('padDisplay');
      d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    }
    function pressKey(key) {
      $('padError').textContent = '';
      if (key === 'del') padValue = padValue.slice(0, -1);
      else if (key === 'clear') padValue = '';
      else if (padValue.length >= 3) { padError('背番号は3桁までです'); return; }
      else padValue = padValue === '0' ? key : padValue + key;
      updatePad();
    }
    function confirmPad() {
      const t = team();
      if (padValue) {
        const dup = Object.keys(t.slots).find(k => k !== editingSlot && t.slots[k] === padValue);
        if (dup) { padError(`${padValue}番は${POS_NAME[dup]}に登録済みです`); return; }
        t.slots[editingSlot] = padValue;
      } else {
        delete t.slots[editingSlot];
      }
      saveData();
      const s = editingSlot;
      closePad();
      renderSlots(s);
    }
    document.querySelectorAll('.slot').forEach(btn => btn.addEventListener('click', () => openPad(btn.dataset.slot)));
    document.querySelectorAll('.pad-key').forEach(btn => btn.addEventListener('click', () => pressKey(btn.dataset.key)));
    $('padOk').addEventListener('click', confirmPad);
    $('padClose').addEventListener('click', closePad);
    $('padBackdrop').addEventListener('click', closePad);
    document.addEventListener('keydown', e => {
      if (!editingSlot) return;
      if (/^[0-9]$/.test(e.key)) pressKey(e.key);
      else if (e.key === 'Backspace') pressKey('del');
      else if (e.key === 'Enter') confirmPad();
      else if (e.key === 'Escape') closePad();
    });

    /* ---------- 登録完了 ---------- */
    function complete() {
      const t = team();
      t.name = t.name.trim();
      const count = Object.keys(t.slots).length;
      if (!t.name) { toast('チーム名を入力してください'); $('teamName').focus(); return; }
      if (teamIndex === 1 && t.name === data.teams[0].name) { toast('1チーム目と同じチーム名です'); return; }
      if (count < 5) { toast(`選手を5人以上登録してください（いま${count}人）`); return; }


      if (teamIndex === 0) {
        teamIndex = 1;
        renderSetup('slide-next');
        $('setup').scrollTop = 0;
        toast(`${t.name}（${count}人）を登録しました`);
      } else {
        const wasEdit = editMode;
        editMode = false;
        if (wasEdit && editFrom === 'setEnd') {
          commitSet();
          proceedToSet();
          if (data.setNo !== 2) toast('オーダーを変更しました');
          return;
        }
        if (wasEdit && editFrom === 'match') {
          // 変更したオーダーで、もう一度セット開始前の立ち位置を表示
          beginSet();
          toast('オーダーを変更しました');
          return;
        }
        renderConfirm();
        goTo('confirm');
        toast(wasEdit ? 'オーダーを変更しました' : 'オーダー登録が完了しました');
      }
    }

    // セット間のオーダー変更
    let editMode = false, editSnapshot = null, editFrom = null;
    function startEdit(back = false, from = 'confirm') {
      editMode = true;
      editFrom = from;
      editSnapshot = JSON.stringify(data.teams);
      teamIndex = 0;
      renderSetup();
      goTo('setup', back);
    }

    /* ---------- 確認ダイアログ ---------- */
    function askConfirm(message, okLabel = 'OK', cancelLabel = 'キャンセル') {
      return new Promise(resolve => {
        $('dlgMsg').textContent = message;
        $('dlgOk').textContent = okLabel;
        $('dlgCancel').textContent = cancelLabel;
        $('dlgBackdrop').classList.add('open');
        $('dlg').classList.add('open');
        const close = result => {
          $('dlgBackdrop').classList.remove('open');
          $('dlg').classList.remove('open');
          $('dlgOk').onclick = $('dlgCancel').onclick = $('dlgBackdrop').onclick = null;
          resolve(result);
        };
        $('dlgOk').onclick = () => close(true);
        $('dlgCancel').onclick = () => close(false);
        $('dlgBackdrop').onclick = () => close(false);
        $('dlgCancel').focus();
      });
    }

    /* ---------- トースト ---------- */
    let toastTimer;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* ---------- 画面遷移 ---------- */
    let current = 'menu';
    // 進む：新しい画面が右から入る／戻る：今の画面が右へ抜ける
    function goTo(id, back = false) {
      const from = $(current), to = $(id);
      if (from === to) return;
      // 入ってくる画面をいったん正しい側に置く
      to.style.transition = 'none';
      to.classList.remove('is-hidden-left', 'is-hidden-right');
      to.classList.add(back ? 'is-hidden-left' : 'is-hidden-right');
      void to.offsetWidth;
      to.style.transition = '';
      from.classList.add(back ? 'is-hidden-right' : 'is-hidden-left');
      to.classList.remove('is-hidden-left', 'is-hidden-right');
      to.scrollTop = 0;
      current = id;
      $('toast').classList.remove('show');
      orientFor(id);
    }
    const openScreen = id => goTo(id);
    const showMenu = () => goTo('menu', true);

    /* ---------- 対戦確認（向かい合わせ） ---------- */
    // 左側のチーム：ネットは右。上から 左・中央・右（選手から見て）
    // 右側のチーム：ネットは左。上から 右・中央・左（選手から見て）
    const LAYOUT = {
      L: { cols: ['B', 'F'], rows: ['L', 'C', 'R'] },
      R: { cols: ['F', 'B'], rows: ['R', 'C', 'L'] }
    };
    // 緑と白のビーチボール（アイコン用）
    function ballSvg(size = 26) {
      const r = 11;
      const paths = [0,1,2,3,4,5].map(i => {
        const a1 = (i * 60 - 90) * Math.PI / 180, a2 = ((i + 1) * 60 - 90) * Math.PI / 180;
        return `<path d="M0 0 L${r*Math.cos(a1)} ${r*Math.sin(a1)} A${r} ${r} 0 0 1 ${r*Math.cos(a2)} ${r*Math.sin(a2)} Z" fill="${i % 2 ? '#fff' : '#23976A'}"/>`;
      }).join('');
      return `<svg viewBox="-12 -12 24 24" width="${size}" height="${size}" aria-hidden="true">${paths}<circle r="11" fill="none" stroke="#0E3F55" stroke-width="1"/></svg>`;
    }
    $('fwBall').innerHTML = ballSvg(56);

    // ローテーション後の並び
    // 選手の入っている位置（空欄以外）はそのままで、選手が順番の1つ前の位置へ移動する
    // （順番2の選手 → 順番1の位置、…、順番1の選手 → 最後の位置）
    // rot 回ローテーションしたとき、各位置にいる選手 { num: 背番号, order: その選手の順番 }
    function lineup(teamIdx, rot = 0) {
      const t = data.teams[teamIdx];
      const L = orderedSlots(t);
      const n = L.length;
      const res = {};
      L.forEach((slot, j) => {
        const src = (j + rot) % n;
        res[slot] = { num: t.slots[L[src]], order: src + 1 };
      });
      return res;
    }

    function courtHtml(teamIdx, side, opts = {}) {
      const { rot = 0, serverKey = null, newServer = false } = opts;
      const lu = lineup(teamIdx, rot);
      const { cols, rows } = LAYOUT[side];
      // 列（前衛・後衛）ごとに、空欄を飛ばして上から並べる
      const colsHtml = cols.map((c, ci) => {
        const items = rows.map(r => c + r).filter(k => lu[k]).map(k => {
          const p = lu[k];
          const srv = k === serverKey;
          return `<div class="vs-slot is-filled t${teamIdx}${srv ? ' is-server' : ''}${srv && newServer ? ' new' : ''}" data-pid="${teamIdx}-${escapeHtml(p.num)}" aria-label="${POS_NAME[k]} ${escapeHtml(p.num)}番${srv ? '（サーブ）' : ''}">
            <span class="order-badge">${p.order}</span>${escapeHtml(p.num)}
            ${srv ? `<span class="serve-ball">${ballSvg(26)}</span>` : ''}
          </div>`;
        }).join('');
        return `<div class="vs-col${ci === 0 ? ' col-first' : ''}">${items}</div>`;
      }).join('');
      return `<div class="vs-court">${colsHtml}</div>`;
    }

    // 前のセットの終了時の立ち位置（ローテーション回数）。第1セットは登録どおり（0）
    function endRotOf(i) {
      const last = data.lastServed && data.lastServed[i];
      return last ? last - 1 : 0;
    }
    // その立ち位置で、これからサーブする選手がいる位置
    function upcomingServerKey(i) {
      const t = data.teams[i];
      const lu = lineup(i, endRotOf(i));
      const n = orderedSlots(t).length;
      const want = ((firstServeOrder(i) - 1) % n) + 1;
      return Object.keys(lu).find(k => lu[k].order === want) || null;
    }

    function sideHtml(teamIdx, side) {
      const t = data.teams[teamIdx];
      // 確認画面は「前のセットの終了時の立ち位置」で表示（サーブ権のマークは試合開始後に表示）
      const cells = courtHtml(teamIdx, side, {
        rot: endRotOf(teamIdx),
        serverKey: null
      }).replace(/^<div class="vs-court">|<\/div>$/g, '');
      const isFirst = data.first === teamIdx;
      return `<div class="vs-name t${teamIdx}">${escapeHtml(t.name || (teamIdx + 1) + 'チーム目')}</div>
              <div class="vs-court">${cells}</div>
              <button class="order-tag ${isFirst ? 'first' : 'second'}" data-action="toggle-order"
                aria-label="${escapeHtml(t.name)}は${isFirst ? '先攻' : '後攻'}。タップで先攻と後攻を入れ替え">${isFirst ? '先攻' : '後攻'}</button>`;
    }
    function renderConfirm(pop) {
      const left = data.left === 1 ? 1 : 0;
      $('confirmTitle').textContent = `第${data.setNo}セット 確認`;
      $('confirmBack').textContent = data.setNo > 1 ? '‹ オーダー変更' : '‹ 修正する';
      const note = $('vsNote');
      const noteText = data.setNo === 3 ? 'コートチェンジと先攻・後攻を決めてください' : '';
      let serveText = '';
      if (data.setNo > 1) {
        serveText = [0, 1].map(i => {
          const t = data.teams[i];
          const ord = firstServeOrder(i);
          const num = t.slots[orderedSlots(t)[ord - 1]];
          return `${t.name}：順番${ord}（${num}番）からサーブ`;
        }).join('\n');
      }
      const full = [noteText, serveText].filter(Boolean).join('\n');
      note.textContent = full;
      note.hidden = !full;
      $('sideL').innerHTML = sideHtml(left, 'L');
      $('sideR').innerHTML = sideHtml(1 - left, 'R');
      const vs = $('vs');
      vs.classList.remove('pop');
      if (pop) { void vs.offsetWidth; vs.classList.add('pop'); }
    }

    let swapping = false, swapTurn = 0;
    function courtChange() {
      if (swapping) return;
      swapTurn += 180;
      $('swapIcon').style.transform = `rotate(${swapTurn}deg)`;
      const done = () => {
        data.left = data.left === 1 ? 0 : 1;
        saveData();
        renderConfirm(true);
        swapping = false;
      };
      if (reduceMotion) { done(); return; }
      swapping = true;
      const opts = { duration: 550, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'forwards' };
      const aL = $('sideL').animate([
        { transform: 'none' },
        { transform: 'translate(50%, -18px) scale(.9)', opacity: .7 },
        { transform: 'translateX(100%)' }
      ], opts);
      const aR = $('sideR').animate([
        { transform: 'none' },
        { transform: 'translate(-50%, 18px) scale(.9)', opacity: .7 },
        { transform: 'translateX(-100%)' }
      ], opts);
      aL.onfinish = () => { done(); aL.cancel(); aR.cancel(); };
    }
    /* ---------- 試合 ---------- */
    // サーブ権：先攻の順番1から。
    // サーブ側が得点 → 同じ選手が続けてサーブ
    // レシーブ側が得点 → サーブ権が移り、そのチームの次の順番の選手がサーブ
    // 15点先取。14-14からは2点差がつくまで。ただし17点目を取ったら勝ち
    const SET_POINT = 15, CAP_POINT = 17, SETS_TO_WIN = 2;
    function isSetWon(mine, other) {
      return mine >= SET_POINT && (mine - other >= 2 || mine >= CAP_POINT);
    }

    let match = null;
    function startMatch() {
      const first = data.first;
      data.firstBySet[data.setNo - 1] = first;
      match = { phase: 'ready', score: [0, 0], serving: first, turn: [0, 0], lastServed: [null, null], history: [], lastScored: null, sideOut: true, over: false, winner: null };
      // 各チームが最初にサーブするときの順番（先攻・後攻とも前のセットの続きから）
      match.start = [firstServeOrder(0), firstServeOrder(1)];
      // セット開始前は「前のセットの終了時の立ち位置」のまま（第1セットは登録どおり）
      // → 試合開始（先攻）やサーブ権を取ったとき（後攻）に、最初のラリーの前でローテーション
      match.endRot = [endRotOf(0), endRotOf(1)];
    }
    // 先攻の最初のサーブ：
    // 前のセットでそのチームが最後にサーブした選手の「次の順番」の選手から。
    // （前のセットで一度もサーブしていない／第1セットなら順番1）
    function firstServeOrder(team) {
      const last = data.lastServed && data.lastServed[team];
      if (!last) return 1;
      const n = orderedSlots(data.teams[team]).length;
      return (last % n) + 1;
    }
    // 今サーブしている選手の順番（1〜）
    function serverOrder(team) {
      const n = orderedSlots(data.teams[team]).length;
      return ((match.turn[team] - 1) % n) + 1;
    }

    // そのチームのローテーション回数（最初にサーブ権を得たときは回らない）
    // まだサーブ権を取っていないチームは、前のセットの終了時の立ち位置のまま
    const rotOf = team => match.turn[team] ? match.turn[team] - 1 : match.endRot[team];

    function renderMatch() {
      // 動かす前の位置を覚えておく（選手が移動するアニメーション用）
      const before = {};
      document.querySelectorAll('#match .vs-slot[data-pid]').forEach(el => { before[el.dataset.pid] = el.getBoundingClientRect(); });

      const left = data.left === 1 ? 1 : 0;
      $('mSet').innerHTML = `第${data.setNo}セット<span>セットカウント ${data.setsWon[left]} - ${data.setsWon[1 - left]}</span>`;
      [['L', left], ['R', 1 - left]].forEach(([side, team]) => {
        const t = data.teams[team];
        const serving = match.serving === team && match.phase !== 'ready';
        const rot = rotOf(team);
        // サーブする選手の位置
        //  ・ラリー中：順番1の位置
        //  ・開始前：これからサーブする選手が今いる位置（開始でローテーションして順番1の位置へ）
        let srvKey = null, srvNum = '';
        if (serving) {
          const lu = lineup(team, rot);
          if (match.turn[team]) srvKey = orderedSlots(t)[0];
          else {
            const n = orderedSlots(t).length;
            const want = ((match.start[team] - 1) % n) + 1;
            srvKey = Object.keys(lu).find(k => lu[k].order === want);
          }
          srvNum = lu[srvKey].num;
        }
        const box = $('mTeam' + side);
        box.classList.toggle('serving', serving);
        box.innerHTML = `
          ${serving ? `<span class="m-ball">${ballSvg(22)}</span>` : ''}
          <div class="m-name t${team}">${escapeHtml(t.name)}</div>
          <div class="m-score${match.lastScored === team ? ' bump' : ''}">${match.score[team]}</div>`;
        $('mCourt' + side).innerHTML = courtHtml(team, side, {
          rot, serverKey: srvKey, newServer: serving && match.sideOut && match.turn[team] === match.start[team]
        });
      });
      if (match.phase === 'over') {
        $('mSet').className = 'm-set over';
        $('mSet').innerHTML = `第${data.setNo}セット<span>${escapeHtml(data.teams[match.winner].name)} がセット獲得</span>`;
      } else {
        $('mSet').className = 'm-set';
      }
      renderControls();
      fitNames();

      // ローテーションで位置が変わった選手をなめらかに移動
      if (!reduceMotion) {
        document.querySelectorAll('#match .vs-slot[data-pid]').forEach(el => {
          const b = before[el.dataset.pid];
          if (!b) return;
          const a = el.getBoundingClientRect();
          const dx = Math.round(b.left - a.left), dy = Math.round(b.top - a.top);
          if (Math.abs(dx) >= 2 || Math.abs(dy) >= 2) el.animate(
            [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
            { duration: 650, easing: 'cubic-bezier(.3,.8,.3,1)' }
          );
        });
      }
    }
    const UNDO_SVG = `<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M9 7 L4 12 L9 17 M4 12 H14 a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>`;
    let controlsPhase = null;
    function renderControls() {
      const c = $('mControls');
      if (controlsPhase !== match.phase) {
        controlsPhase = match.phase;
        c.className = 'm-controls ' + match.phase;
        const undo = `<div class="undo-group">
            <button class="undo-btn" data-action="undo" id="undoBtn" aria-label="1つ前に戻る">${UNDO_SVG}</button>
            <span class="undo-label">戻る</span></div>`;
        if (match.phase === 'ready') {
          c.innerHTML = `<div class="ctl-center ready"><p class="ctl-hint">立ち位置を確認してから開始してください</p>
            <button class="big-btn" data-action="play">${data.setNo === 1 ? '試合開始' : `第${data.setNo}セット開始`}</button></div>`;
        } else if (match.phase === 'playing') {
          c.innerHTML = `<button class="point-btn" data-action="point" data-side="L">得点</button>
            <div class="ctl-center">${undo}</div>
            <button class="point-btn" data-action="point" data-side="R">得点</button>`;
        } else {
          const matchOver = data.setsWon[match.winner] + 1 >= SETS_TO_WIN;
          c.innerHTML = `<div class="ctl-center over">${undo}<button class="big-btn end" data-action="end-set">${matchOver ? '試合終了' : 'セット終了'}</button></div>`;
        }
      }
      const u = $('undoBtn');
      if (u) u.disabled = match.history.length === 0;
      updateMatchBack();
    }
    // 試合画面の左上のボタン
    //  第2・第3セットの開始前 → オーダー変更（選手交代の修正）
    //  それ以外 → 第2セットはメニュー、第1・第3セットは確認画面
    function updateMatchBack() {
      $('matchBack').textContent =
        match && match.phase === 'ready' && data.setNo > 1 ? '‹ オーダー変更'
        : data.setNo === 2 ? '‹ メニュー' : '‹ 確認画面';
    }

    // チーム名は得点と同じ大きさ。枠に収まらない長い名前だけ自動で縮める
    function fitNames() {
      document.querySelectorAll('#match .m-name').forEach(el => {
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        while (el.scrollWidth > el.clientWidth && size > 12) {
          size -= 1;
          el.style.fontSize = size + 'px';
        }
      });
    }
    window.addEventListener('resize', () => { if (current === 'match') fitNames(); });

    function scorePoint(side) {
      if (match.phase !== 'playing') return;
      const left = data.left === 1 ? 1 : 0;
      const team = side === 'L' ? left : 1 - left;
      match.history.push(JSON.stringify({ score: match.score, serving: match.serving, turn: match.turn, lastServed: match.lastServed }));
      // このラリーでサーブした選手を記録（次のセットの最初のサーブ用）
      match.lastServed[match.serving] = serverOrder(match.serving);
      match.score[team]++;
      match.lastScored = team;
      if (isSetWon(match.score[team], match.score[1 - team])) {
        // セットが決まった1点ではローテーションしない（サーブ権も動かさない）
        // → そのままの立ち位置を確認してから「セット終了」
        match.sideOut = false;
        match.phase = 'over';
        match.over = true;
        match.winner = team;
        renderMatch();
        return;
      }
      match.sideOut = match.serving !== team;
      if (match.sideOut) {
        match.serving = team;
        // そのセットで初めてサーブ権を取ったときは回らず、決められた選手からサーブ
        match.turn[team] = match.turn[team] ? match.turn[team] + 1 : match.start[team];
      }
      renderMatch();
    }
    function undoPoint() {
      if (!match.history.length) return;
      Object.assign(match, JSON.parse(match.history.pop()));
      match.lastScored = null;
      match.sideOut = false;
      match.over = false;
      match.winner = null;
      match.phase = 'playing';
      renderMatch();
    }

    /* ---------- セット終了・試合終了 ---------- */
    function renderSetEnd() {
      const w = match.winner;
      const matchOver = data.setsWon[w] + 1 >= SETS_TO_WIN;
      const left = data.left === 1 ? 1 : 0;
      const nm = i => escapeHtml(data.teams[i].name);
      $('seHead').textContent = matchOver ? `試合終了（第${data.setNo}セット）` : `第${data.setNo}セット終了`;
      $('seWinner').innerHTML = matchOver ? `${nm(w)}<br>の勝ち！` : `${nm(w)} がセット獲得`;
      $('seScore').innerHTML = [left, 1 - left].map((i, k) =>
        (k ? '<span class="dash">-</span>' : '') +
        `<div><div class="nm">${nm(i)}</div><div class="pt${i === w ? ' win' : ''}">${match.score[i]}</div></div>`
      ).join('');
      const rows = [...data.sets, { score: match.score, winner: w }];
      $('seSets').innerHTML = rows.map((r, i) => `
        <div class="se-row">
          <span class="lbl">第${i + 1}セット</span>
          <span class="n${r.winner === 0 ? ' w' : ''}">${nm(0)}</span>
          <span>${r.score[0]} - ${r.score[1]}</span>
          <span class="n${r.winner === 1 ? ' w' : ''}">${nm(1)}</span>
        </div>`).join('');
      $('seNext').innerHTML = matchOver
        ? `<button class="menu-btn primary" data-action="menu-end">メニューに戻る</button>`
        : `<p>第${data.setNo + 1}セットの前の選手交代</p>
           <div class="sub-toggle" role="group" aria-label="選手交代">
             <button data-action="sub-set" data-val="0" aria-pressed="true">なし</button>
             <button data-action="sub-set" data-val="1" aria-pressed="false">あり</button>
           </div>
           <button class="menu-btn primary" data-action="next-set" id="nextSetBtn"></button>`;
      setSub(false);
    }

    let withSub = false;
    function setSub(v) {
      withSub = v;
      document.querySelectorAll('.sub-toggle button').forEach(b => {
        const on = (b.dataset.val === '1') === v;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on);
      });
      const next = data.setNo + 1;
      const btn = $('nextSetBtn');
      if (btn) btn.textContent = v ? 'オーダー変更へ'
        : next === 2 ? '第2セット開始（コートチェンジ）' : '第3セットの準備へ';
    }

    // セットの結果を確定して、次のセットの設定にする
    function commitSet() {
      const w = match.winner;
      data.sets.push({ score: [...match.score], winner: w });
      data.lastServed = [...match.lastServed];
      data.setsWon[w]++;
      data.setNo++;
      if (data.setNo === 2) {
        // 第2セット：必ずコートチェンジ、第1セットの後攻が先攻（固定）
        data.left = data.left === 1 ? 0 : 1;
        data.first = 1 - data.firstBySet[0];
      } else {
        // 第3セット：確認画面でコートチェンジと先攻・後攻を決める（初期値は1チーム目が先攻）
        data.first = 0;
      }
      match = null;
    }
    // 次のセットを始める（第2セットはそのまま試合画面、第3セットは確認画面）
    function proceedToSet() {
      if (data.setNo === 2) {
        beginSet();
        toast('第2セット：コートチェンジしました');
      } else {
        renderConfirm();
        goTo('confirm');
      }
    }
    function beginSet() {
      $('mCourtL').innerHTML = $('mCourtR').innerHTML = '';
      controlsPhase = null;
      startMatch();
      match.sideOut = true;
      updateMatchBack();
      renderMatch();
      goTo('match');
    }
    function nextSet() {
      if (withSub) startEdit(false, 'setEnd');   // 結果はオーダー変更が終わってから確定
      else { commitSet(); proceedToSet(); }
    }

    function quit() {
      const fw = $('farewell');
      fw.classList.remove('show'); void fw.offsetWidth;
      fw.classList.add('show');
      setTimeout(() => {
        releaseOrientation();                // 全画面・向きの固定を解除
        goTo('bye');
        fw.classList.remove('show');
      }, 2000);
    }

    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'setup') { data = blankMatch(); editMode = false; match = null; teamIndex = 0; renderSetup(); openScreen('setup'); }
      else if (action === 'quit') quit();
      else if (action === 'complete') complete();
      else if (action === 'swap') courtChange();
      else if (action === 'toggle-order') {
        // 先攻と後攻を入れ替える（必ずどちらかが先攻、どちらかが後攻）
        data.first = 1 - data.first;
        renderConfirm();
        const vs = $('vs'); vs.classList.remove('flip'); void vs.offsetWidth; vs.classList.add('flip');
      }
      else if (action === 'start') beginSet();
      else if (action === 'point') scorePoint(btn.dataset.side);
      else if (action === 'play') {
        // 最初のラリー開始：先攻チームは必要ならここでローテーション
        match.phase = 'playing';
        match.turn[match.serving] = match.start[match.serving];
        match.sideOut = true;
        renderMatch();
      }
      else if (action === 'end-set') { renderSetEnd(); goTo('setEnd'); }
      else if (action === 'undo') undoPoint();
      else if (action === 'sub-set') setSub(btn.dataset.val === '1');
      else if (action === 'next-set') nextSet();
      else if (action === 'menu-end') { match = null; showMenu(); }
      else if (action === 'menu') {
        const msg = data.setNo > 1 ? '試合を終了してメニューに戻りますか？' : 'メニューに戻りますか？\n登録したオーダーは消えます。';
        askConfirm(msg, 'メニューに戻る').then(ok => { if (ok) showMenu(); });
      }
      else if (action === 'back') {
        if (current === 'setup' && teamIndex === 1) { teamIndex = 0; renderSetup('slide-prev'); }
        else if (current === 'setup' && editMode) {
          // 変更をやめる：変更前のオーダーに戻す
          data.teams = JSON.parse(editSnapshot);
          editMode = false;
          if (editFrom === 'setEnd') goTo('setEnd', true);
          else if (editFrom === 'match') goTo('match');   // セット開始前の画面へ
          else { renderConfirm(); goTo('confirm', true); }
        }
        else if (current === 'confirm') {
          if (data.setNo > 1) startEdit(true);
          else { teamIndex = 1; renderSetup(); goTo('setup', true); }
        }
        else if (current === 'setEnd') goTo('match', true);
        else if (current === 'match' && match && match.phase === 'ready' && data.setNo > 1) {
          startEdit(true, 'match');          // 選手交代の修正
        }
        else if (current === 'match') {
          if (data.setNo === 2) {
            askConfirm('試合を中断してメニューに戻りますか？\n得点は消えます。', 'メニューに戻る')
              .then(ok => { if (ok) { match = null; showMenu(); } });
          } else {
            askConfirm('試合を中断して確認画面に戻りますか？\nこのセットの得点は消えます。', '確認画面に戻る')
              .then(ok => { if (ok) { renderConfirm(); goTo('confirm', true); } });
          }
        }
        else showMenu();
      }
    });


    /* =========================================================
       オープニングアニメーション
       0.00s  相手コートの前衛がアンダーサーブ（高い山なりで後方へ）
       0.48s  レシーブ
       0.98s  トス
       1.38s  スパイク → 相手コートに突き刺さる → 画面が切り替わる
       ========================================================= */
    (function opening() {
      const layer = document.getElementById('opening');
      let done = false, raf = 0, wipeStarted = false;

      function finish() {
        if (done) return;
        done = true;
        cancelAnimationFrame(raf);
        document.body.classList.add('ready');
        layer.style.opacity = '0';
        layer.style.pointerEvents = 'none';
        setTimeout(() => layer.remove(), 500);
      }

      if (reduceMotion) { layer.remove(); document.body.classList.add('ready'); return; }
      layer.addEventListener('click', finish);

      const NS = 'http://www.w3.org/2000/svg';
      const GROUND = 250;
      const svg = document.getElementById('opSvg');
      const ball = document.getElementById('opBall');
      const trailG = document.getElementById('opTrail');
      const burst = document.getElementById('opBurst');
      const impact = document.getElementById('opImpact');

      // --- ビーチボール（緑と白が交互） ---
      const BALL_R = 11;
      const colors = ['#23976A', '#FFFFFF', '#23976A', '#FFFFFF', '#23976A', '#FFFFFF'];
      ball.innerHTML = colors.map((c, i) => {
        const a1 = (i * 60 - 90) * Math.PI / 180, a2 = ((i + 1) * 60 - 90) * Math.PI / 180;
        const x1 = BALL_R * Math.cos(a1), y1 = BALL_R * Math.sin(a1);
        const x2 = BALL_R * Math.cos(a2), y2 = BALL_R * Math.sin(a2);
        return `<path d="M0 0 L${x1} ${y1} A${BALL_R} ${BALL_R} 0 0 1 ${x2} ${y2} Z" fill="${c}"/>`;
      }).join('') + `<circle r="3" fill="#fff"/>`;

      // --- 補助関数 ---
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
